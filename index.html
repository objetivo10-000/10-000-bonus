<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reto $10K — Bonos Bancarios</title>
<meta name="theme-color" content="#0a0f1e">

<!-- PWA & Pantalla de inicio -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="$10K Bonos">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface-input: #070b14;
    --border: #1e2d45;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-glow: rgba(0,229,160,0.35);
    --gold: #f5c542;
    --gold-dim: rgba(245,197,66,0.12);
    --text: #e8f0fe;
    --muted: #6b7fa3;
    --danger: #ff5f5f;
    --card-radius: 18px;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 80px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ── HEADER CON LOGO ── */
  header {
    text-align: center;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-logo {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    object-fit: cover;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0, 229, 160, 0.2);
    border: 1px solid rgba(0, 229, 160, 0.3);
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }

  /* ── HERO CARD ── */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px 20px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .amounts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 22px;
  }

  .amount-block { text-align: center; }

  .amount-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .amount-value {
    font-size: 1.8rem;
    font-weight: 700;
    line-height: 1;
  }

  .amount-value.earned { color: var(--accent); }
  .amount-value.remaining { color: var(--gold); }

  .progress-wrap { margin-bottom: 16px; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-pct {
    font-size: 26px;
    font-weight: 800;
    color: var(--accent);
  }

  .progress-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .bar-track {
    background: var(--border);
    border-radius: 99px;
    height: 10px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #00c87a, var(--accent));
    transition: width 0.7s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 12px var(--accent-glow);
    min-width: 4px;
  }

  .time-section {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    text-align: center;
  }

  .time-block .val {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
  }

  .time-block .lbl {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  /* ── FORMULARIO REORGANIZADO ── */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 20px;
    margin-bottom: 18px;
  }

  .add-card h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .input-row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  label {
    font-size: 11px;
    color: #9ab0d3;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"] {
    background: var(--surface-input);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: #ffffff;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    width: 100%;
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  /* Quick chips para montos frecuentes */
  .quick-amounts {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .chip-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
  }

  .chip-btn:active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .btn-add {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #0a0f1e;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    width: 100%;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-add:active { transform: scale(0.98); }

  /* ── HISTORIAL ── */
  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    overflow: hidden;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .log-header h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .log-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .empty-state {
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .empty-state .icon { font-size: 30px; margin-bottom: 8px; }

  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }

  .entry:last-child { border-bottom: none; }

  .entry-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 18px;
    text-align: right;
  }

  .entry-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .entry-info { flex: 1; min-width: 0; }

  .entry-source {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-date {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .entry-amount {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }

  .btn-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 6px;
  }

  .btn-del:active { color: var(--danger); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: #0a0f1e;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 99px;
    transition: transform 0.25s ease;
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <!-- Logo de tu repositorio -->
  <img src="icon-512.png" alt="Logo $10K" class="app-logo" onerror="this.style.display='none'">
  <p class="eyebrow">Reto 2026 · 2027</p>
  <h1>$10K en Bonos</h1>
  <p class="subtitle">Jun 1, 2026 → Jun 1, 2027</p>
</header>

<!-- HERO CARD -->
<div class="hero-card">
  <div class="amounts-row">
    <div class="amount-block">
      <div class="amount-label">Ganado</div>
      <div class="amount-value earned" id="totalEarned">$0</div>
    </div>
    <div class="amount-block">
      <div class="amount-label">Restante</div>
      <div class="amount-value remaining" id="totalRemaining">$10,000</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-pct" id="pct">0%</span>
      <span class="progress-meta" id="progressMeta">$0 de $10,000</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar" style="width:0%"></div>
    </div>
  </div>

  <div class="time-section">
    <div class="time-block">
      <div class="val" id="daysLeft">—</div>
      <div class="lbl">Días left</div>
    </div>
    <div class="time-block">
      <div class="val" id="timePct">—</div>
      <div class="lbl">Tiempo usado</div>
    </div>
    <div class="time-block">
      <div class="val" id="pace">—</div>
      <div class="lbl">Necesario/mes</div>
    </div>
  </div>
</div>

<!-- AGREGAR BONO -->
<div class="add-card">
  <h2><span>+</span> Agregar Bono</h2>
  <div class="form-stack">
    <div class="input-group">
      <label>Fuente (banco o tarjeta)</label>
      <input type="text" id="srcInput" placeholder="Ej: Chase Sapphire, Fifth Third...">
    </div>

    <div class="input-row-grid">
      <div class="input-group">
        <label>Cantidad ($)</label>
        <input type="number" id="amtInput" placeholder="Ej: 450" min="1" step="1">
        <div class="quick-amounts">
          <button type="button" class="chip-btn" onclick="setAmt(200)">$200</button>
          <button type="button" class="chip-btn" onclick="setAmt(300)">$300</button>
          <button type="button" class="chip-btn" onclick="setAmt(500)">$500</button>
        </div>
      </div>
      <div class="input-group">
        <label>Fecha</label>
        <input type="date" id="dateInput">
      </div>
    </div>

    <button class="btn-add" onclick="addEntry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Guardar Bono
    </button>
  </div>
</div>

<!-- HISTORIAL -->
<div class="log-card">
  <div class="log-header">
    <h2>Historial de bonos</h2>
    <span class="log-count" id="logCount">0 bonos</span>
  </div>
  <div id="logList">
    <div class="empty-state">
      <div class="icon">🏦</div>
      <div>Aún no hay bonos registrados.<br>¡Agrega tu primer bono arriba!</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GOAL = 10000;
const START = new Date('2026-06-01');
const END   = new Date('2027-06-01');
const KEY   = 'bonusReto10k';

let entries = [];

function init() {
  const saved = localStorage.getItem(KEY);
  if (saved) entries = JSON.parse(saved);

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').value = today;

  render();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(entries));
}

function setAmt(val) {
  document.getElementById('amtInput').value = val;
}

function addEntry() {
  const src = document.getElementById('srcInput').value.trim();
  const amt = parseFloat(document.getElementById('amtInput').value);
  const dt  = document.getElementById('dateInput').value;

  if (!src) { showToast('Escribe el banco o tarjeta'); return; }
  if (!amt || amt <= 0) { showToast('Ingresa una cantidad válida'); return; }
  if (!dt) { showToast('Selecciona una fecha'); return; }

  entries.unshift({ id: Date.now(), src, amt, dt });
  save();

  document.getElementById('srcInput').value = '';
  document.getElementById('amtInput').value = '';

  render();
  showToast(`+$${fmt(amt)} agregado con éxito ✓`);
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  render();
}

function render() {
  const total = entries.reduce((s, e) => s + e.amt, 0);
  const remaining = Math.max(0, GOAL - total);
  const pctNum = Math.min(100, (total / GOAL) * 100);

  document.getElementById('totalEarned').textContent   = '$' + fmt(total);
  document.getElementById('totalRemaining').textContent = '$' + fmt(remaining);
  document.getElementById('pct').textContent           = pctNum.toFixed(1) + '%';
  document.getElementById('progressMeta').textContent  = `$${fmt(total)} de $${fmt(GOAL)}`;
  document.getElementById('bar').style.width           = pctNum + '%';

  const now = new Date();
  const totalDays  = (END - START) / 86400000;
  const elapsed    = Math.max(0, (now - START) / 86400000);
  const daysLeft   = Math.max(0, Math.ceil((END - now) / 86400000));
  const timePct    = Math.min(100, (elapsed / totalDays) * 100);
  const monthsLeft = daysLeft / 30.44;
  const pace       = monthsLeft > 0 ? remaining / monthsLeft : 0;

  document.getElementById('daysLeft').textContent = daysLeft;
  document.getElementById('timePct').textContent  = timePct.toFixed(0) + '%';
  document.getElementById('pace').textContent     = pace > 0 ? '$' + fmt(Math.ceil(pace)) : '¡Listo!';

  const logList = document.getElementById('logList');
  document.getElementById('logCount').textContent = entries.length + (entries.length === 1 ? ' bono' : ' bonos');

  if (entries.length === 0) {
    logList.innerHTML = `
      <div class="empty-state">
        <div class="icon">🏦</div>
        <div>Aún no hay bonos registrados.<br>¡Agrega tu primer bono arriba!</div>
      </div>`;
    return;
  }

  logList.innerHTML = entries.map((e, i) => `
    <div class="entry">
      <span class="entry-num">${entries.length - i}</span>
      <div class="entry-dot"></div>
      <div class="entry-info">
        <div class="entry-source">${esc(e.src)}</div>
        <div class="entry-date">${fmtDate(e.dt)}</div>
      </div>
      <div class="entry-amount">+$${fmt(e.amt)}</div>
      <button class="btn-del" onclick="deleteEntry(${e.id})" title="Eliminar">✕</button>
    </div>
  `).join('');
}

function fmt(n) {
  return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function fmtDate(str) {
  const [y, m, d] = str.split('-');
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('SW registrado:', reg.scope))
        .catch((err) => console.warn('Fallo SW:', err));
    });
  }
</script>
</body>
</html>
