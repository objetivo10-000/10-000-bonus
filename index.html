<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reto $10K — Bonos Bancarios</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --border: #1e2d45;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-glow: rgba(0,229,160,0.35);
    --gold: #f5c542;
    --gold-dim: rgba(245,197,66,0.12);
    --text: #e8f0fe;
    --muted: #6b7fa3;
    --danger: #ff5f5f;
    --card-radius: 16px;
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    font-weight: 300;
    margin-top: 8px;
    font-family: 'DM Mono', monospace;
  }

  /* ── MAIN COUNTER ── */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 32px 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .amounts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }

  .amount-block { text-align: center; }

  .amount-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .amount-value {
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 700;
    line-height: 1;
  }

  .amount-value.earned { color: var(--accent); }
  .amount-value.remaining { color: var(--gold); }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 16px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .progress-pct {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
  }

  .progress-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .bar-track {
    background: var(--border);
    border-radius: 99px;
    height: 10px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #00c87a, var(--accent));
    transition: width 0.7s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 12px var(--accent-glow);
    min-width: 4px;
  }

  /* Time progress */
  .time-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    text-align: center;
  }

  .time-block .val {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }

  .time-block .lbl {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── ADD BONUS FORM ── */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  .add-card h2 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--accent);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 18px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
  }

  input[type="text"],
  input[type="number"],
  input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    width: 100%;
    transition: border-color 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  input[type="number"] { max-width: 160px; }

  .btn-add {
    align-self: flex-end;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0a0f1e;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 22px;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-add:hover { opacity: 0.88; }
  .btn-add:active { transform: scale(0.97); }

  /* ── LOG ── */
  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--card-radius);
    overflow: hidden;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
  }

  .log-header h2 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .log-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  .entry {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .entry:last-child { border-bottom: none; }
  .entry:hover { background: rgba(255,255,255,0.02); }

  .entry-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 24px;
    text-align: right;
  }

  .entry-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .entry-info { flex: 1; min-width: 0; }

  .entry-source {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-date {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .entry-amount {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }

  .btn-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }

  .btn-del:hover { color: var(--danger); background: rgba(255,95,95,0.1); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #0a0f1e;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 99px;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── CONFETTI BURST (CSS only) ── */
  @keyframes pop { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(2.5)} }

  .celebration { display: none; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Reto 2026 · 2027</p>
  <h1>$10K en<br>Bonos</h1>
  <p class="subtitle">Jun 1, 2026 → Jun 1, 2027</p>
</header>

<!-- HERO CARD -->
<div class="hero-card">
  <div class="amounts-row">
    <div class="amount-block">
      <div class="amount-label">Ganado</div>
      <div class="amount-value earned" id="totalEarned">$0</div>
    </div>
    <div class="amount-block">
      <div class="amount-label">Restante</div>
      <div class="amount-value remaining" id="totalRemaining">$10,000</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-pct" id="pct">0%</span>
      <span class="progress-meta" id="progressMeta">0 de $10,000</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar" style="width:0%"></div>
    </div>
  </div>

  <div class="time-section">
    <div class="time-block">
      <div class="val" id="daysLeft">—</div>
      <div class="lbl">Días left</div>
    </div>
    <div class="time-block">
      <div class="val" id="timePct">—</div>
      <div class="lbl">Tiempo usado</div>
    </div>
    <div class="time-block">
      <div class="val" id="pace">—</div>
      <div class="lbl">Necesario/mes</div>
    </div>
  </div>
</div>

<!-- ADD BONUS -->
<div class="add-card">
  <h2>+ Agregar bono</h2>
  <div class="input-row">
    <div class="input-group" style="flex:2">
      <label>Fuente (banco / tarjeta)</label>
      <input type="text" id="srcInput" placeholder="Ej: Chase Sapphire, Amex Gold…">
    </div>
    <div class="input-group">
      <label>Cantidad ($)</label>
      <input type="number" id="amtInput" placeholder="500" min="1" step="1">
    </div>
    <div class="input-group">
      <label>Fecha</label>
      <input type="date" id="dateInput">
    </div>
    <button class="btn-add" onclick="addEntry()">Agregar</button>
  </div>
</div>

<!-- LOG -->
<div class="log-card">
  <div class="log-header">
    <h2>Historial de bonos</h2>
    <span class="log-count" id="logCount">0 bonos</span>
  </div>
  <div id="logList">
    <div class="empty-state">
      <div class="icon">🏦</div>
      <div>Aún no hay bonos registrados.<br>¡Agrega tu primer bono arriba!</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GOAL = 10000;
const START = new Date('2026-06-01');
const END   = new Date('2027-06-01');
const KEY   = 'bonusReto10k';

let entries = [];

// ── INIT ──
function init() {
  const saved = localStorage.getItem(KEY);
  if (saved) entries = JSON.parse(saved);

  // Default date = today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').value = today;

  render();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(entries));
}

// ── ADD ──
function addEntry() {
  const src = document.getElementById('srcInput').value.trim();
  const amt = parseFloat(document.getElementById('amtInput').value);
  const dt  = document.getElementById('dateInput').value;

  if (!src) { showToast('Escribe la fuente del bono'); return; }
  if (!amt || amt <= 0) { showToast('Cantidad inválida'); return; }
  if (!dt) { showToast('Selecciona una fecha'); return; }

  entries.unshift({ id: Date.now(), src, amt, dt });
  save();

  document.getElementById('srcInput').value = '';
  document.getElementById('amtInput').value = '';

  render();
  showToast(`+$${fmt(amt)} agregado ✓`);
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  render();
}

// ── RENDER ──
function render() {
  const total = entries.reduce((s, e) => s + e.amt, 0);
  const remaining = Math.max(0, GOAL - total);
  const pctNum = Math.min(100, (total / GOAL) * 100);

  document.getElementById('totalEarned').textContent   = '$' + fmt(total);
  document.getElementById('totalRemaining').textContent = '$' + fmt(remaining);
  document.getElementById('pct').textContent           = pctNum.toFixed(1) + '%';
  document.getElementById('progressMeta').textContent  = `$${fmt(total)} de $${fmt(GOAL)}`;
  document.getElementById('bar').style.width           = pctNum + '%';

  // Time calc
  const now = new Date();
  const totalDays  = (END - START) / 86400000;
  const elapsed    = Math.max(0, (now - START) / 86400000);
  const daysLeft   = Math.max(0, Math.ceil((END - now) / 86400000));
  const timePct    = Math.min(100, (elapsed / totalDays) * 100);
  const monthsLeft = daysLeft / 30.44;
  const pace       = monthsLeft > 0 ? remaining / monthsLeft : 0;

  document.getElementById('daysLeft').textContent = daysLeft;
  document.getElementById('timePct').textContent  = timePct.toFixed(0) + '%';
  document.getElementById('pace').textContent     = pace > 0 ? '$' + fmt(Math.ceil(pace)) : '¡Listo!';

  // Log
  const logList = document.getElementById('logList');
  document.getElementById('logCount').textContent = entries.length + (entries.length === 1 ? ' bono' : ' bonos');

  if (entries.length === 0) {
    logList.innerHTML = `
      <div class="empty-state">
        <div class="icon">🏦</div>
        <div>Aún no hay bonos registrados.<br>¡Agrega tu primer bono arriba!</div>
      </div>`;
    return;
  }

  logList.innerHTML = entries.map((e, i) => `
    <div class="entry">
      <span class="entry-num">${entries.length - i}</span>
      <div class="entry-dot"></div>
      <div class="entry-info">
        <div class="entry-source">${esc(e.src)}</div>
        <div class="entry-date">${fmtDate(e.dt)}</div>
      </div>
      <div class="entry-amount">+$${fmt(e.amt)}</div>
      <button class="btn-del" onclick="deleteEntry(${e.id})" title="Eliminar">✕</button>
    </div>
  `).join('');
}

// ── HELPERS ──
function fmt(n) {
  return n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function fmtDate(str) {
  const [y, m, d] = str.split('-');
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>
</body>
</html>
